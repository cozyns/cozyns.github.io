<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1">
    <title>Cozyns Website</title>
    <link rel="icon" type="image/png" href="/images/logo.png">

    <!-- CSS load -->
    <link rel="stylesheet" href="/css/root.css">
    <link rel="stylesheet" href="/css/indexStyle.css">
    <link rel="stylesheet" href="/css/headerStyle.css">

    <!-- Synchronous theme load -->
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>

<body>
    <!-- Main load screen -->
    <div class="main-loader" id="main-loader">
        <h1>Welcome</h1>
    </div>

    <!-- Main content -->
    <div class="main-content" id="main-content">

        <!-- Header -->
        <div id="header-placeholder"></div>

        <div class="full-background"></div>
        <div class="spotlight" id="spotlight"></div>

        <!-- Content -->
        <div class="content">
            <section class="top">
                <div class="left"></div>
                <div class="right">
                    <div class="bio-section">
                        <div class="bio">
                            <h1>Cozyns</h1>
                            <p>      Full stack developer.
                                <br> Diploma in Computer Engineering.
                                <br> Univercity Malaysia Perlis (UNIMAP).
                            </p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="/js/mainLoader.js"></script>
    <script src="/js/fetchHeader.js"></script>
    <script src="/js/typingAnimation.js"></script>
    <script src="/js/spotlight.js"></script>
    <script src="/js/theme.js"></script>
</body>

</html>
