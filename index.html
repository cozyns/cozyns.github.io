<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1">
    <title>Cozyns Website</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">

    <!-- CSS load -->
    <link rel="stylesheet" href="assets/css/root.css">
    <link rel="stylesheet" href="assets/css/indexStyle.css">
    <link rel="stylesheet" href="assets/css/headerStyle.css">

    <!-- Synchronous theme load -->
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>

<body>
    <!-- Main load screen -->
    <div class="main-loader" id="main-loader">
        <h1>Welcome</h1>
    </div>

    <!-- Main content -->
    <div class="main-content" id="main-content">

        <!-- Header -->
        <div id="header-placeholder"></div>

        <div class="full-background"></div>
        <div class="spotlight" id="spotlight"></div>

        <!-- Content -->
        <div class="content">
            <section class="top">
                <div class="left">
                    <div class="bio-section">
                        <div class="bio">
                            <div class="profile-pic"></div>
                            <div class="top-content">
                                <h1>Cozyns008</h1>
                            </div>
                            <div class="bottom-content">
                                <p>Full stack developer 2.0</p>
                                <p>Diploma in Computer Engineering</p>
                                <p>University Malaysia Perlis (UNIMAP)</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="right"></div>
            </section>
        </div>
    </div>

    <script src="assets/js/mainLoader.js"></script>
    <script src="assets/js/fetchHeader.js"></script>
    <script src="assets/js/typingAnimation.js"></script>
    <script src="assets/js/spotlight.js"></script>
    <script src="assets/js/theme.js"></script>
</body>

</html>
